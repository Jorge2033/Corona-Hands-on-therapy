services:
  web:
    build: .
    container_name: corona-hands-on-therapy
    restart: unless-stopped
    # Ya no publica el puerto 80: ahora Caddy recibe el tráfico público
    # y lo reenvía aquí por la red interna de Docker.
    expose:
      - "3000"
    env_file:
      # Credenciales del correo y clave de cifrado (crear en el VPS, NO subir a git)
      - .env.production
    environment:
      # Base de datos SQLite en el volumen persistente
      - DB_PATH=/app/data/submissions.db
    volumes:
      # Volumen administrado por Docker: la base de datos sobrevive
      # reconstrucciones y reinicios del contenedor
      - corona-data:/app/data

  caddy:
    image: caddy:2-alpine
    container_name: corona-caddy
    restart: unless-stopped
    ports:
      # El 80 hace falta para el desafío de Let's Encrypt y para redirigir a HTTPS
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Los certificados viven aquí: sin este volumen se volverían a pedir en
      # cada reinicio y Let's Encrypt aplica límites de frecuencia
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - web

volumes:
  corona-data:
  caddy-data:
  caddy-config:
  caddy-logs:
